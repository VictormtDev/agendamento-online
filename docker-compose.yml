# Local-only credentials: these databases never leave the developer machine or CI.
name: scheduling-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduling
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scheduling']
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate container so tests can wipe tables freely without touching dev data.
  # tmpfs keeps it in memory: faster, and every restart starts from a clean slate.
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduling_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scheduling_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
